title:
  mk: Шопска салата
  en: Shopska salad
summary:
  mk: Домати, краставици, пиперки и кромид под снег од бело сирење.
  en: Tomatoes, cucumber, peppers and onion under a snowfall of white cheese.
category: salad
meals: [lunch, dinner]
servings: 4
time: { prep: 15 }
difficulty: easy
diet: [vegetarian, gluten-free]
season: [summer]

ingredients:
  - items:
      - { ingredient: tomato, qty: 4, unit: pc }
      - { ingredient: cucumber, qty: 2, unit: pc }
      - { ingredient: green-pepper, qty: 2, unit: pc, note: { mk: свежи или печени, en: fresh or roasted } }
      - { ingredient: onion, qty: 1, unit: pc }
      - { ingredient: feta-cheese, qty: 150, unit: g }
      - { ingredient: sunflower-oil, qty: 3, unit: tbsp }
      - { ingredient: vinegar, qty: 1, unit: tbsp }
      - { ingredient: parsley, qty: 0.25, unit: bunch }
      - { ingredient: salt, unit: to-taste }

steps:
  - text:
      mk: Исечи ги доматите, краставиците и пиперките на коцки, а кромидот на тенки полумесечини.
      en: Dice the tomatoes, cucumbers and peppers; slice the onion into thin half-moons.
  - text:
      mk: Посоли, прелиј со масло и оцет и измешај.
      en: Season with salt, dress with oil and vinegar and toss.
  - text:
      mk: Изренди го сирењето одозгора во дебел слој и поспи со сецкан магдонос.
      en: Grate the cheese generously over the top and sprinkle with chopped parsley.

variants:
  - id: fasting
    name: { mk: Посна, en: Fasting }
    note:
      mk: Без сирење — додај неколку маслинки за посен ден.
      en: No cheese — add a few olives for a fasting day.
    remove: [feta-cheese]
