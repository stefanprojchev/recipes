title:
  mk: Попара
  en: Popara (bread and milk breakfast)
summary:
  mk: Бајат леб, врело млеко и бело сирење — топол појадок за пет минути.
  en: Day-old bread, hot milk and white cheese — a warm breakfast in five minutes.
category: breakfast
meals: [breakfast]
servings: 2
time: { prep: 5, cook: 5 }
difficulty: easy
tags: [kid-friendly]
diet: [vegetarian]
season: [autumn, winter]

ingredients:
  - items:
      - { ingredient: stale-bread, qty: 4, unit: slice }
      - { ingredient: milk, qty: 400, unit: ml }
      - { ingredient: butter, qty: 1, unit: tbsp }
      - { ingredient: feta-cheese, qty: 100, unit: g }

steps:
  - text:
      mk: Исечи го лебот на коцки и распореди го во две длабоки чинии.
      en: Cut the bread into cubes and divide between two deep bowls.
  - text:
      mk: Загреј го млекото со путерот додека не зоврие.
      en: Heat the milk with the butter until it just boils.
    timer: 5
  - text:
      mk: Прелиј го лебот со врелото млеко, изрони сирење одозгора и јади веднаш.
      en: Pour the hot milk over the bread, crumble the cheese on top and eat straight away.

variants:
  - id: sweet
    name: { mk: Слатка, en: Sweet }
    note:
      mk: Без сирење — засладете со мед и малку цимет.
      en: Skip the cheese — sweeten with honey and a pinch of cinnamon.
    add:
      - { ingredient: honey, qty: 1, unit: tbsp }
      - { ingredient: cinnamon, qty: 1, unit: pinch }
    remove: [feta-cheese]
