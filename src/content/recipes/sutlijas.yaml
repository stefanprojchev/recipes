title:
  mk: Сутлијаш
  en: Sutlijaš (rice pudding)
summary:
  mk: Кремаст оризов пудинг со ванила и цимет — ладен десерт или ужинка.
  en: Creamy rice pudding with vanilla and cinnamon — a chilled dessert or snack.
category: dessert
meals: [snack]
servings: 6
time: { prep: 5, cook: 40, rest: 60 }
difficulty: easy
tags: [kid-friendly]
diet: [vegetarian, gluten-free]

ingredients:
  - items:
      - { ingredient: rice, qty: 100, unit: g }
      - { ingredient: water, qty: 200, unit: ml }
      - { ingredient: milk, qty: 1, unit: l }
      - { ingredient: sugar, qty: 120, unit: g }
      - { ingredient: vanilla-sugar, qty: 1, unit: pack }
      - { ingredient: salt, qty: 1, unit: pinch }
      - { ingredient: cinnamon, unit: to-taste }

steps:
  - text:
      mk: Свари го оризот во водата со прстофат сол додека водата не се впие.
      en: Cook the rice in the water with a pinch of salt until the water is absorbed.
    timer: 10
  - text:
      mk: Додај го млекото и вари на тивок оган, често мешајќи, додека не се згусне.
      en: Add the milk and simmer gently, stirring often, until thick.
    timer: 30
  - text:
      mk: Додај шеќер и ванилин шеќер и вари уште 2–3 минути.
      en: Stir in the sugar and vanilla sugar and cook another 2–3 minutes.
  - text:
      mk: Истури во чашки, остави да се олади и стави во фрижидер. Пред сервирање поспи со цимет.
      en: Pour into cups, let cool and chill. Dust with cinnamon before serving.
    timer: 60
