title:
  mk: Пилешка супа
  en: Chicken soup
summary:
  mk: Домашна супа со пилешко, зеленчук и фиде, збогатена со јајце и лимон.
  en: Homemade soup with chicken, vegetables and vermicelli, finished with egg and lemon.
category: soup
meals: [lunch, dinner]
servings: 6
time: { prep: 15, cook: 70 }
difficulty: easy
tags: [kid-friendly]
season: [autumn, winter]

ingredients:
  - items:
      - { ingredient: chicken-legs, qty: 800, unit: g }
      - { ingredient: water, qty: 2.5, unit: l }
      - { ingredient: carrot, qty: 2, unit: pc }
      - { ingredient: onion, qty: 1, unit: pc }
      - { ingredient: celery-root, qty: 1, unit: slice }
      - { ingredient: vermicelli, qty: 100, unit: g }
      - { ingredient: salt, unit: to-taste }
      - { ingredient: black-pepper, unit: to-taste }
      - { ingredient: parsley, qty: 0.5, unit: bunch }
  - title: { mk: За збогатување, en: To finish }
    items:
      - { ingredient: egg, qty: 1, unit: pc }
      - { ingredient: lemon, qty: 0.5, unit: pc, note: { mk: сок, en: juice } }

steps:
  - text:
      mk: Стави го пилешкото во ладна вода и донеси до вриење. Собирај ја пената што се крева.
      en: Put the chicken in cold water and bring to the boil, skimming off the foam.
    timer: 10
  - text:
      mk: Додај ги исечените моркови, кромидот и целерот, посоли и вари на тивок оган.
      en: Add the sliced carrots, onion and celery, season and simmer gently.
    timer: 45
  - text:
      mk: Извади го месото, оддели го од коските, исецкај го и врати го во супата.
      en: Lift out the chicken, pull the meat off the bones, chop it and return it to the pot.
  - text:
      mk: Додај го фидето и вари уште неколку минути.
      en: Add the vermicelli and cook a few more minutes.
    timer: 5
  - text:
      mk: Тргни од оган. Измати го јајцето со лимоновиот сок, полека додај една кутлача топла супа, па истури во тенџерето мешајќи. Поспи магдонос.
      en: Take off the heat. Whisk the egg with the lemon juice, temper it with a ladle of hot soup, then stir it into the pot. Sprinkle with parsley.

tips:
  mk: Не враќај ја супата да зоврие откако ќе го додадеш јајцето — ќе се згрутчи.
  en: Don't bring the soup back to the boil after adding the egg, or it will curdle.
storage:
  mk: Во фрижидер до 3 дена. Фидето упива течност — дополни со вода при подгревање.
  en: Keeps 3 days in the fridge. The vermicelli soaks up liquid — add water when reheating.
