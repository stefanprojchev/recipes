title:
  mk: Посни полнети пиперки
  en: Fasting stuffed peppers
summary:
  mk: Пиперки полнети со ориз, кромид и морков — без месо, за посни денови.
  en: Peppers stuffed with rice, onion and carrot — meat-free for fasting days.
category: main
meals: [lunch, dinner]
servings: 4
time: { prep: 30, cook: 60 }
difficulty: easy
diet: [vegan, fasting]
season: [summer, autumn]
variantOf: polneti-piperki

ingredients:
  - items:
      - { ingredient: bell-pepper, qty: 8, unit: pc }
      - { ingredient: rice, qty: 250, unit: g }
      - { ingredient: onion, qty: 2, unit: pc, note: { mk: ситно сецкан, en: finely chopped } }
      - { ingredient: carrot, qty: 1, unit: pc, note: { mk: ренден, en: grated } }
      - { ingredient: sunflower-oil, qty: 100, unit: ml }
      - { ingredient: ground-paprika, qty: 2, unit: tsp }
      - { ingredient: dried-mint, qty: 1, unit: tsp }
      - { ingredient: parsley, qty: 0.5, unit: bunch }
      - { ingredient: salt, unit: to-taste }
      - { ingredient: black-pepper, unit: to-taste }
      - { ingredient: water, qty: 600, unit: ml }

steps:
  - text:
      mk: Измиј ги пиперките, исечи им ги капачињата и извади ги семките.
      en: Wash the peppers, cut off the tops and remove the seeds.
  - text:
      mk: На масло задинстај ги кромидот и морковот, додај го оризот и половина од алевата пиперка и мешај 3 минути. Зачини со нане, магдонос, сол и пипер.
      en: Soften the onion and carrot in oil, add the rice and half the paprika and stir for 3 minutes. Season with mint, parsley, salt and pepper.
    timer: 3
  - text:
      mk: Наполни ги пиперките до три четвртини и нареди ги во длабок сад. Прелиј со вода измешана со остатокот алева пиперка.
      en: Fill the peppers three-quarters full and stand them in a deep dish. Pour over the water mixed with the remaining paprika.
  - text:
      mk: Печи покриени на 200°C, па откриј и печи до румено.
      en: Bake covered at 200°C, then uncover and bake until browned.
    timer: 60
