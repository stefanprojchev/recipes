title:
  mk: Овесна каша со банана
  en: Banana oatmeal
summary:
  mk: Топла каша од овес со банана, мед и ореви — брз и заситен појадок.
  en: Warm oats with banana, honey and walnuts — a quick, filling breakfast.
category: breakfast
meals: [breakfast, snack]
servings: 2
time: { prep: 2, cook: 6 }
difficulty: easy
tags: [kid-friendly]
diet: [vegetarian]

ingredients:
  - items:
      - { ingredient: oats, qty: 80, unit: g }
      - { ingredient: milk, qty: 400, unit: ml }
      - { ingredient: banana, qty: 1, unit: pc }
      - { ingredient: honey, qty: 1, unit: tbsp }
      - { ingredient: walnuts, qty: 30, unit: g }
      - { ingredient: cinnamon, qty: 1, unit: pinch }
      - { ingredient: salt, qty: 1, unit: pinch }

steps:
  - text:
      mk: Стави ги овесот, млекото и солта во тенџере и вари на среден оган, мешајќи, додека не се згусне.
      en: Put the oats, milk and salt in a pan and cook over medium heat, stirring, until thick.
    timer: 5
  - text:
      mk: Издроби половина банана во кашата и измешај.
      en: Mash half the banana into the oats and stir.
  - text:
      mk: Распореди во чинии, додај тркалца банана, ореви, мед и цимет.
      en: Spoon into bowls and top with sliced banana, walnuts, honey and cinnamon.

variants:
  - id: apple
    name: { mk: Со јаболко, en: With apple }
    note:
      mk: Изренди го јаболкото и вари го заедно со овесот. Цимет додај подарежливо.
      en: Grate the apple and cook it with the oats. Be generous with the cinnamon.
    add:
      - { ingredient: apple, qty: 1, unit: pc }
    remove: [banana]
