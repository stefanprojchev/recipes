title:
  mk: Мусака со компири
  en: Potato moussaka
summary:
  mk: Слоеви компири и мелено месо, печени под златна кора од јајца и млеко.
  en: Layers of potato and minced meat, baked under a golden egg-and-milk topping.
category: main
meals: [lunch, dinner]
servings: 6
time: { prep: 30, cook: 65, rest: 10 }
difficulty: medium
tags: [kid-friendly]

ingredients:
  - items:
      - { ingredient: potato, qty: 1.5, unit: kg }
      - { ingredient: minced-meat, qty: 500, unit: g }
      - { ingredient: onion, qty: 2, unit: pc, note: { mk: ситно сецкан, en: finely chopped } }
      - { ingredient: carrot, qty: 1, unit: pc, note: { mk: ренден, en: grated }, optional: true }
      - { ingredient: sunflower-oil, qty: 4, unit: tbsp }
      - { ingredient: ground-paprika, qty: 1, unit: tsp }
      - { ingredient: parsley, qty: 0.5, unit: bunch }
      - { ingredient: salt, unit: to-taste }
      - { ingredient: black-pepper, unit: to-taste }
      - { ingredient: water, qty: 200, unit: ml }
  - title: { mk: Прелив, en: Topping }
    items:
      - { ingredient: egg, qty: 3, unit: pc }
      - { ingredient: milk, qty: 300, unit: ml }
      - { ingredient: flour, qty: 1, unit: tbsp }

steps:
  - text:
      mk: Излупи ги компирите и исечи ги на тркалца дебели околу половина сантиметар. Посоли ги малку.
      en: Peel the potatoes and slice them about half a centimetre thick. Salt lightly.
  - text:
      mk: Во тава на масло пропржи го кромидот (и морковот), па додај го месото. Пржи додека месото не порумени и не се ронка.
      en: Fry the onion (and carrot) in oil, then add the meat. Cook until browned and crumbly.
    timer: 10
  - text:
      mk: Зачини со алева пиперка, сол, пипер и сецкан магдонос.
      en: Season with paprika, salt, pepper and chopped parsley.
  - text:
      mk: Во подмачкан плех нареди слој компири, па месото, па пак компири. Налеј ја водата.
      en: In a greased tray layer potatoes, then the meat, then potatoes again. Pour in the water.
  - text:
      mk: Печи на 200°C додека компирите не омекнат.
      en: Bake at 200°C until the potatoes are tender.
    timer: 40
  - text:
      mk: Измати ги јајцата со млекото и брашното и прелиј ја мусаката. Врати во рерна додека преливот не порумени.
      en: Whisk the eggs with the milk and flour and pour over the moussaka. Return to the oven until the topping is golden.
    timer: 15
  - text:
      mk: Остави да отстои пред сечење — така парчињата не се распаѓаат.
      en: Let it rest before cutting so the pieces hold together.
    timer: 10

variants:
  - id: eggplant
    name: { mk: Со модар патлиџан, en: With eggplant }
    note:
      mk: Замени половина од компирите со тркалца модар патлиџан, претходно посолени 20 минути, исцедени и кратко пржени.
      en: Replace half the potatoes with eggplant slices — salted for 20 minutes, squeezed and briefly fried.
    add:
      - { ingredient: eggplant, qty: 2, unit: pc }
