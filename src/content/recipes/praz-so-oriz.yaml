title:
  mk: Праз со ориз
  en: Leeks with rice
summary:
  mk: Задушен праз со ориз, домати и алева пиперка — едноставен зимски ручек во едно тенџере.
  en: Braised leeks with rice, tomatoes and paprika — a simple one-pot winter lunch.
category: main
meals: [lunch, dinner]
servings: 4
time: { prep: 15, cook: 35 }
difficulty: easy
diet: [vegan, fasting, gluten-free]
season: [autumn, winter]
source:
  name: Gotvach.bg
  url: https://recepti.gotvach.bg/r-3765-%D0%9F%D1%80%D0%B0%D0%B7_%D1%81_%D0%BE%D1%80%D0%B8%D0%B7
sides: [salata-od-zelka, salata-od-morkov, salata-od-cveklo, salata-pecheni-piperki]

art:
  vessel: clay
  fill: leek
  items: [leek-ring*10, rice*30, carrot-coin*4, herb*4]

ingredients:
  - items:
      - { ingredient: leek, qty: 4, unit: pc, note: { mk: "околу 1 кг, на тркалца", en: "about 1 kg, sliced" } }
      - { ingredient: rice, qty: 200, unit: g, note: { mk: измиен, en: rinsed } }
      - { ingredient: canned-tomatoes, qty: 200, unit: g, note: { mk: или доматен сок, en: or tomato juice } }
      - { ingredient: olive-oil, qty: 5, unit: tbsp }
      - { ingredient: ground-paprika, qty: 1, unit: tsp }
      - { ingredient: water, qty: 800, unit: ml, note: { mk: врела, en: hot } }
      - { ingredient: salt, unit: to-taste }
      - { ingredient: black-pepper, unit: to-taste }

steps:
  - text:
      mk: Празот исечи го на тркалца од 1 см и измиј го добро во цедалка — меѓу листовите има земја.
      en: Slice the leeks into 1 cm rounds and wash well in a colander — there's grit between the layers.
  - text:
      mk: Во тенџере на маслото задуши го празот со неколку лажици вода додека не омекне.
      en: In a pot, braise the leeks in the oil with a few spoons of water until soft.
    timer: 10
  - text:
      mk: Додај ја алевата пиперка и доматите и мешај една минута, па налеј ја врелата вода и остави да зоврие.
      en: Add the paprika and tomatoes and stir for a minute, then pour in the hot water and bring to the boil.
  - text:
      mk: Додај го оризот, посоли и вари на тивок оган, мешајќи повремено, додека оризот не омекне.
      en: Add the rice, season and simmer on low heat, stirring now and then, until the rice is tender.
    timer: 20
  - text:
      mk: Тргни од оган, пиперосај и остави покриено 5 минути пред служење.
      en: Take off the heat, season with pepper and leave covered for 5 minutes before serving.
    timer: 5

variants:
  - id: pork
    name: { mk: Со свинско месо, en: With pork }
    note:
      mk: Свинско на коцки пропржи го прво додека не порумени, налеј малку вода и вари 30 минути, па додај го празот и продолжи по рецептот.
      en: Brown diced pork first, add a little water and simmer 30 minutes, then add the leeks and carry on with the recipe.
    add:
      - { ingredient: pork, qty: 400, unit: g }
  - id: chicken
    name: { mk: Со пилешко, en: With chicken }
    note:
      mk: Пилешки бутчиња пропржи ги прво и вари ги 20 минути пред празот.
      en: Brown chicken legs first and simmer 20 minutes before adding the leeks.
    add:
      - { ingredient: chicken-legs, qty: 600, unit: g }
  - id: oven
    name: { mk: Во рерна со маслинки, en: Baked with olives }
    note:
      mk: По додавањето на оризот префрли во тепсија, додај маслинки и печи на 200°C околу 30 минути, додека не се запече одозгора.
      en: After adding the rice, move to a baking dish, add olives and bake at 200°C for about 30 minutes until browned on top.
    add:
      - { ingredient: olives, qty: 60, unit: g }

tips:
  mk: Служи со кисело млеко. Најслатки се зимските стебла праз — користи го и светлозелениот дел.
  en: Serve with yogurt. Winter leeks are sweetest — use the light green part too.
