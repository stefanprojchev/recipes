# Shared ingredient dictionary — recipes reference these ids.
#
# name:   per locale; `mk` is required. Use { one, other } for whole items
#         counted with unit "pc" ("1 јајце" / "2 јајца"). For Macedonian
#         count words, fold them into the name: "главица кромид".
# aisle:  produce | meat | dairy | bakery | dry | spices | canned | frozen | other
# staple: true = always in the pantry, left off shopping lists.

